name: Repository schedule keepalive

on:
  push:
    branches:
      - master
    paths:
      - '.github/scripts/repository_keepalive.py'
      - '.github/workflows/repository-keepalive.yml'
  schedule:
    - cron: '37 6 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: Commit a fresh marker even when the 28-day threshold has not elapsed
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: repository-schedule-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Decide whether the activity marker is due
        id: keepalive
        env:
          KEEPALIVE_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          KEEPALIVE_THRESHOLD_DAYS: '28'
        run: python .github/scripts/repository_keepalive.py

      - name: Commit the refreshed default-branch marker
        if: steps.keepalive.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/state/repository-keepalive.json
          git commit -m 'Keep public scheduled workflows active'
          git push origin HEAD:master
