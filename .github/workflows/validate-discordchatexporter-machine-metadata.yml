name: Validate DiscordChatExporter machine metadata patch

on:
  push:
    branches:
      - chatgpt/validate-discordchatexporter-machine-metadata

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out validation files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out DiscordChatExporter
        run: |
          git clone --depth 1 --branch prime https://github.com/Tyrrrz/DiscordChatExporter.git source
          test "$(git -C source rev-parse HEAD)" = "905489b01b5523719082275c34c232fc47f827c6"

      - name: Install .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: source/global.json

      - name: Repair generated hunk counts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("dce/discordchatexporter-machine-metadata.patch")
          lines = path.read_text().splitlines()
          result = []
          index = 0

          while index < len(lines):
              line = lines[index]
              match = re.match(
                  r"@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)?( @@.*)?$",
                  line,
              )
              if match is None:
                  result.append(line)
                  index += 1
                  continue

              body = []
              index += 1
              while (
                  index < len(lines)
                  and not lines[index].startswith("@@ ")
                  and not lines[index].startswith("diff --git ")
              ):
                  body.append(lines[index])
                  index += 1

              old_count = sum(
                  1 for body_line in body if body_line.startswith((" ", "-"))
              )
              new_count = sum(
                  1 for body_line in body if body_line.startswith((" ", "+"))
              )
              suffix = match.group(3) or " @@"
              result.append(
                  f"@@ -{match.group(1)},{old_count} +{match.group(2)},{new_count}{suffix}"
              )
              result.extend(body)

          path.write_text("\n".join(result) + "\n")
          PY

      - name: Apply patch
        run: |
          git -C source apply --reject --whitespace=nowarn "$GITHUB_WORKSPACE/dce/discordchatexporter-machine-metadata.patch" || true

          python - <<'PY'
          from pathlib import Path

          root = Path("source")
          rejects = list(root.rglob("*.rej"))
          expected_reject = root / "DiscordChatExporter.Gui/ViewModels/Dialogs/ExportSetupViewModel.cs.rej"
          if rejects != [expected_reject]:
              raise SystemExit(f"Unexpected rejected hunks: {rejects}")

          path = root / "DiscordChatExporter.Gui/ViewModels/Dialogs/ExportSetupViewModel.cs"
          text = path.read_text()
          old = "            || IsReverseMessageOrder;"
          new = "            || IsReverseMessageOrder\n            || !ShouldIncludeMachineMetadata;"
          if text.count(old) != 1:
              raise SystemExit("Could not locate the advanced-options preference block")

          path.write_text(text.replace(old, new))
          expected_reject.unlink()
          PY

          git -C source diff --check

      - name: Refine metadata behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("source")

          def replace_exact(relative_path: str, old: str, new: str, expected_count: int = 1) -> None:
              path = root / relative_path
              text = path.read_text()
              if text.count(old) != expected_count:
                  raise SystemExit(
                      f"Expected {expected_count} occurrence(s) in {relative_path}, found {text.count(old)}"
                  )
              path.write_text(text.replace(old, new))

          replace_exact(
              "DiscordChatExporter.Cli/Commands/Base/ExportCommandBase.cs",
              'Description = "Include machine-readable metadata in HTML exports."',
              'Description = "Include machine-readable metadata in HTML exports (enabled by default)."',
          )

          replace_exact(
              "DiscordChatExporter.Core/Exporting/HtmlMessageWriter.cs",
              '"data-metadata-version"',
              '"data-machine-metadata-version"',
          )
          replace_exact(
              "DiscordChatExporter.Core/Exporting/HtmlMessageWriter.cs",
              '("data-guild-id", Context.Request.Guild.Id),',
              '("data-guild-id", Context.Request.Guild.IsDirect ? null : Context.Request.Guild.Id),',
          )

          replace_exact(
              "DiscordChatExporter.Cli.Tests/Specs/HtmlContentSpecs.cs",
              '"data-metadata-version"',
              '"data-machine-metadata-version"',
              expected_count=2,
          )

          replace_exact(
              "DiscordChatExporter.Gui/ViewModels/Dialogs/ExportSetupViewModel.cs",
              """    [ObservableProperty]
              public partial ExportFormat SelectedFormat { get; set; }
              """,
              """    [ObservableProperty]
              [NotifyPropertyChangedFor(nameof(IsMachineMetadataAvailable))]
              public partial ExportFormat SelectedFormat { get; set; }
              """,
          )
          replace_exact(
              "DiscordChatExporter.Gui/ViewModels/Dialogs/ExportSetupViewModel.cs",
              """    public bool IsSingleChannel => Channels?.Count == 1;
              """,
              """    public bool IsSingleChannel => Channels?.Count == 1;

              public bool IsMachineMetadataAvailable =>
                  SelectedFormat is ExportFormat.HtmlDark or ExportFormat.HtmlLight;
              """,
          )

          replace_exact(
              "DiscordChatExporter.Gui/Views/Dialogs/ExportSetupView.axaml",
              """            <DockPanel
                LastChildFill="False"
                ToolTip.Tip="{Binding LocalizationManager.MachineMetadataTooltip}"
              >
              """,
              """            <DockPanel
                IsVisible="{Binding IsMachineMetadataAvailable}"
                LastChildFill="False"
                ToolTip.Tip="{Binding LocalizationManager.MachineMetadataTooltip}"
              >
              """,
          )
          PY

          git -C source diff --check

      - name: Format
        working-directory: source
        run: |
          dotnet tool install csharpier --tool-path "$RUNNER_TEMP/csharpier" --version 1.3.0
          export PATH="$RUNNER_TEMP/csharpier:$PATH"
          csharpier format .
          git diff --check

      - name: Build
        working-directory: source
        run: dotnet build -p:CSharpier_Bypass=true --configuration Release

      - name: Verify formatting
        working-directory: source
        run: dotnet build -t:CSharpierFormat --configuration Release --no-restore

      - name: Generate validated patch
        run: |
          git -C source diff --check
          git -C source diff --binary > discordchatexporter-machine-metadata.patch

      - name: Upload validated patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discordchatexporter-machine-metadata
          path: discordchatexporter-machine-metadata.patch
          if-no-files-found: error
