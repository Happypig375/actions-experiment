name: Important update Tibo feed

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/important-update-tibo-feed.yml'
      - '.github/scripts/publish_generated_snapshot.py'
  schedule:
    - cron: '55 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: important-update-tibo-feed
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Collect Tibo timeline candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw hot/views
          python - <<'PY'
          import datetime as dt
          import email.utils
          import html
          import json
          import pathlib
          import re
          import urllib.request
          import xml.etree.ElementTree as ET

          now = dt.datetime.now(dt.timezone.utc)
          user_agent = 'Happypig375-public-info-aggregators/1.0'
          sources = [
              ('fxtwitter', 'https://fxtwitter.com/thsottiaux/feed.xml'),
              ('rsshub-chyi', 'https://rsshub.chyi.org/twitter/user/thsottiaux'),
              ('rsshub-olivetint', 'https://rsshub.olivetint.com/twitter/user/thsottiaux'),
          ]

          def iso(value):
              return value.astimezone(dt.timezone.utc).isoformat().replace('+00:00', 'Z')

          def fetch(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      'User-Agent': user_agent,
                      'Accept': 'application/rss+xml, application/atom+xml, application/xml, text/xml, */*',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return response.read()

          def strip_markup(value):
              value = re.sub(r'<br\s*/?>', '\n', value or '', flags=re.I)
              value = re.sub(r'</p\s*>', '\n', value, flags=re.I)
              return html.unescape(re.sub(r'<[^>]+>', '', value)).strip()

          def parse_time(value):
              if not value:
                  return None
              try:
                  return dt.datetime.fromisoformat(
                      value.replace('Z', '+00:00')
                  ).astimezone(dt.timezone.utc)
              except Exception:
                  pass
              try:
                  parsed = email.utils.parsedate_to_datetime(value)
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=dt.timezone.utc)
                  return parsed.astimezone(dt.timezone.utc)
              except Exception:
                  return None

          def parse_feed(body):
              root = ET.fromstring(body)
              items = []

              for item in root.findall('.//item'):
                  title = item.findtext('title') or ''
                  description = (
                      item.findtext('description')
                      or item.findtext(
                          '{http://purl.org/rss/1.0/modules/content/}encoded'
                      )
                      or ''
                  )
                  link = item.findtext('link') or item.findtext('guid') or ''
                  published = (
                      item.findtext('pubDate')
                      or item.findtext('{http://purl.org/dc/elements/1.1/}date')
                      or ''
                  )
                  text = strip_markup(description or title)
                  if title and title not in text:
                      text = (strip_markup(title) + '\n' + text).strip()
                  timestamp = parse_time(published)
                  items.append(
                      {
                          'text': text,
                          'url': link,
                          'published_at': iso(timestamp) if timestamp else published,
                      }
                  )

              namespace = {'a': 'http://www.w3.org/2005/Atom'}
              for entry in root.findall('.//a:entry', namespace):
                  title = entry.findtext(
                      'a:title', default='', namespaces=namespace
                  )
                  content = entry.findtext(
                      'a:content', default='', namespaces=namespace
                  ) or entry.findtext(
                      'a:summary', default='', namespaces=namespace
                  )
                  link = next(
                      (
                          item.attrib.get('href')
                          for item in entry.findall('a:link', namespace)
                          if item.attrib.get('href')
                      ),
                      '',
                  )
                  published = entry.findtext(
                      'a:published', default='', namespaces=namespace
                  ) or entry.findtext(
                      'a:updated', default='', namespaces=namespace
                  )
                  text = strip_markup(content or title)
                  if title and title not in text:
                      text = (strip_markup(title) + '\n' + text).strip()
                  timestamp = parse_time(published)
                  items.append(
                      {
                          'text': text,
                          'url': link,
                          'published_at': iso(timestamp) if timestamp else published,
                      }
                  )

              deduplicated = {}
              for item in items:
                  key = item.get('url') or item.get('text')
                  if key:
                      deduplicated[key] = item
              return list(deduplicated.values())

          errors = []
          mode = 'unavailable'
          items = []
          raw_body = b''
          source_url = None
          for label, url in sources:
              try:
                  body = fetch(url)
                  parsed = parse_feed(body)
                  if not parsed:
                      raise RuntimeError('feed parsed but contained no entries')
                  items = parsed
                  raw_body = body
                  mode = label
                  source_url = url
                  break
              except Exception as exc:
                  errors.append(f'{label}: {exc}')

          def item_time(item):
              return parse_time(item.get('published_at')) or dt.datetime.min.replace(
                  tzinfo=dt.timezone.utc
              )

          items.sort(key=item_time, reverse=True)
          items = items[:50]
          for item in items:
              item['source_handle'] = '@thsottiaux'
              item['authority'] = 'Tibo Sottiaux / OpenAI Codex & ChatGPT Work lead'

          pathlib.Path('raw/tibo-feed.xml').write_bytes(raw_body)
          pathlib.Path('hot/views/tibo.json').write_text(
              json.dumps(
                  {
                      'schema_version': 1,
                      'generated_at': iso(now),
                      'source': '@thsottiaux',
                      'acquisition_mode': mode,
                      'candidate_discovery_only': True,
                      'source_url': source_url,
                      'items': items,
                      'errors': errors,
                  },
                  indent=2,
              ),
              encoding='utf-8',
          )
          pathlib.Path('hot/index.json').write_text(
              json.dumps(
                  {
                      'schema_version': 1,
                      'purpose': 'Important Update Watch authoritative Tibo timeline feed',
                      'generated_at': iso(now),
                      'fresh_for_seconds': 4500,
                      'source': {
                          'key': 'tibo',
                          'name': '@thsottiaux',
                          'view_path': 'views/tibo.json',
                          'status': 'ok' if items else 'unavailable',
                          'acquisition_mode': mode,
                          'candidate_count': len(items),
                          'errors': errors,
                      },
                  },
                  indent=2,
              ),
              encoding='utf-8',
          )
          PY

      - name: Upload raw Tibo acquisition
        id: tibo
        uses: actions/upload-artifact@v4
        with:
          name: important-update-tibo-raw
          path: raw/tibo-feed.xml
          retention-days: 1
          compression-level: 6
          if-no-files-found: warn

      - name: Publish Tibo hot feed snapshot monotonically
        shell: bash
        env:
          TIBO_ARTIFACT_ID: ${{ steps.tibo.outputs.artifact-id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import pathlib

          path = pathlib.Path('hot/index.json')
          document = json.loads(path.read_text(encoding='utf-8'))
          raw_id = os.environ.get('TIBO_ARTIFACT_ID')
          if raw_id:
              document['source']['raw_artifact_id'] = int(raw_id)
              document['source']['raw_artifact_name'] = 'important-update-tibo-raw'
          path.write_text(json.dumps(document, indent=2), encoding='utf-8')
          PY

          python .github/scripts/publish_generated_snapshot.py \
            --source-dir hot \
            --branch chatgpt-important-update-tibo-feed \
            --metadata-file index.json \
            --timestamp-field generated_at \
            --message 'Refresh important update Tibo feed'
