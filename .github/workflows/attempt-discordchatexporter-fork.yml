name: Attempt DiscordChatExporter fork

on:
  push:
    branches:
      - chatgpt/attempt-discordchatexporter-fork

permissions:
  contents: write

jobs:
  fork:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          response_file="$(mktemp)"
          status="$({
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              https://api.github.com/repos/Tyrrrz/DiscordChatExporter/forks
          })"

          echo "GitHub fork API status: $status"
          cat "$response_file"
          echo

          if [ "$status" != "202" ]; then
            exit 1
          fi
